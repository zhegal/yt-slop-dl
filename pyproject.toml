[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-slop-dl"
version = "0.1.0"
description = "YT Slop DL — a small native YouTube video downloader"
readme = "README.md"
requires-python = ">=3.12"
# Essentials supplies PySide6.QtCore/QtGui/QtWidgets without WebEngine/Addons.
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
yt-slop-dl = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
